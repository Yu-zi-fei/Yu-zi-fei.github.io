<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活光影 · Yu-zi-fei照片博客</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: rgba(255, 255, 255, 0.68);
            --panel-strong: rgba(255, 255, 255, 0.86);
            --panel-stroke: rgba(255, 255, 255, 0.72);
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-tertiary: #6b7280;
            --blue: #0071e3;
            --blue-strong: #005fcc;
            --shadow-soft: 0 24px 80px rgba(15, 23, 42, 0.12);
            --shadow-card: 0 18px 60px rgba(15, 23, 42, 0.1);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 20px;
            --container: 1180px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at top left, rgba(116, 170, 255, 0.28), transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(255, 174, 204, 0.24), transparent 26%),
                radial-gradient(circle at 50% 100%, rgba(152, 203, 255, 0.18), transparent 24%),
                linear-gradient(180deg, #f8fbff 0%, #f3f6fb 46%, #eef2f8 100%);
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
        }

        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(24px);
            opacity: 0.55;
            animation: drift 16s var(--ease) infinite alternate;
        }

        .orb-one {
            top: 72px;
            left: -60px;
            width: 260px;
            height: 260px;
            background: linear-gradient(135deg, rgba(130, 189, 255, 0.6), rgba(255, 255, 255, 0.1));
        }

        .orb-two {
            top: 28%;
            right: -110px;
            width: 340px;
            height: 340px;
            background: linear-gradient(135deg, rgba(255, 196, 214, 0.48), rgba(197, 232, 255, 0.18));
            animation-duration: 20s;
        }

        .orb-three {
            bottom: -120px;
            left: 38%;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, rgba(172, 204, 255, 0.36), rgba(255, 255, 255, 0.08));
            animation-duration: 18s;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #7ab7ff, #0071e3, #8cc8ff);
            z-index: 100;
            transition: width 100ms linear;
        }

        .page-shell {
            position: relative;
            z-index: 1;
        }

        .container {
            width: min(calc(100% - 40px), var(--container));
            margin: 0 auto;
        }

        .glass {
            background: var(--panel);
            border: 1px solid var(--panel-stroke);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), var(--shadow-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
        }

        .site-nav-wrap {
            position: sticky;
            top: 18px;
            z-index: 20;
            padding-top: 22px;
        }

        .site-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 20px;
            border-radius: 999px;
            transition: transform 280ms var(--ease), background 280ms var(--ease), box-shadow 280ms var(--ease);
        }

        .site-nav.is-scrolled {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.78);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78), 0 24px 60px rgba(15, 23, 42, 0.14);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.94), rgba(132, 188, 255, 0.88));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 10px 24px rgba(0, 113, 227, 0.26);
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .hero {
            padding: 40px 0 24px;
        }

        .hero-copy {
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            padding: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin-bottom: 18px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.62);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .eyebrow::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(180deg, #5eb0ff, #0071e3);
            box-shadow: 0 0 12px rgba(0, 113, 227, 0.32);
        }

        h1, h2, h3, h4 {
            margin: 0;
            letter-spacing: -0.035em;
        }

        .hero-title {
            font-size: clamp(2.8rem, 6vw, 4.2rem);
            line-height: 1.05;
        }

        .hero-meta {
            min-width: 160px;
        }

        .stat-card {
            padding: 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.74);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), 0 18px 36px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .stat-value {
            font-size: clamp(2rem, 4vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .stat-label {
            margin-top: 6px;
            color: var(--text-tertiary);
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .hero-copy {
                flex-direction: column;
                align-items: flex-start;
                padding: 32px 24px;
            }
            .hero-meta {
                width: 100%;
            }
        }

        .section { padding: 24px 0; }
        .section-heading { margin-bottom: 22px; }
        .section-title { font-size: clamp(1.8rem, 3.5vw, 2.6rem); }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .photo-card {
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 18px 48px rgba(15, 23, 42, 0.08);
            transition: transform 320ms var(--ease);
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-6px) scale(1.015);
        }

        .photo-media {
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .photo-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-info { padding: 16px 20px 18px; }
        .photo-date { font-size: 13px; color: var(--text-tertiary); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-tertiary);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 300ms var(--ease);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 16px;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: -48px;
            right: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-caption {
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="ambient">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
    </div>

    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="page-shell">
        <div class="container">
            <div class="site-nav-wrap">
                <nav class="site-nav glass" id="siteNav">
                    <div class="brand">
                        <div class="brand-mark">光</div>
                        <div class="brand-text">
                            <span class="brand-title">生活光影</span>
                            <span class="brand-subtitle">Yu-zi-fei照片Blog</span>
                        </div>
                    </div>
                </nav>
            </div>
        </div>

        <div class="container">
            <section class="hero">
                <div class="hero-copy glass">
                    <div>
                        <div class="eyebrow">Yu-zi-fei博客</div>
                        <h1 class="hero-title">用光影<br>书写生活</h1>
                    </div>
                    <div class="hero-meta">
                        <div class="stat-card">
                            <div class="stat-value" id="totalPhotos">0</div>
                            <div class="stat-label">张照片</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="container">
            <section class="section" id="gallery">
                <div class="section-heading">
                    <h2 class="section-title">我的相册</h2>
                </div>

                <div class="photo-grid" id="photoGrid">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">🖼️</div>
                        <p>相册还是空的</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img src="" alt="大图预览" id="modalImg">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
        // =========================================================
        // 【后期独自添加图片】
        // 只需要在 photos 数组中，追加图片对象即可！
        // =========================================================
        let photos = [
            {
                id: 1,
                url: "https://cdn.jsdelivr.net/gh/Yu-zi-fei/Yu-zi-fei.github.io@main/images/IMG20260520053906.jpg",
                date: "2026-08-07 摄影"
            },
            {
                id: 2,
                url: "https://cdn.jsdelivr.net/gh/Yu-zi-fei/Yu-zi-fei.github.io@main/images/wallhaven-weog1q.jpg",
                date: "2026-08-07 壁纸"
            }
        ];

        const photoGrid = document.getElementById('photoGrid');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const modalClose = document.getElementById('modalClose');
        const scrollProgress = document.getElementById('scrollProgress');
        const siteNav = document.getElementById('siteNav');
        const totalPhotos = document.getElementById('totalPhotos');

        function renderPhotos() {
            photoGrid.innerHTML = '';

            if (photos.length === 0) {
                photoGrid.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            photos.forEach((photo) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <div class="photo-media">
                        <img src="${photo.url}" alt="照片" loading="lazy">
                    </div>
                    <div class="photo-info">
                        <span class="photo-date">${photo.date}</span>
                    </div>
                `;
                card.addEventListener('click', () => openModal(photo));
                photoGrid.appendChild(card);
            });
        }

        function updateStats() {
            totalPhotos.textContent = photos.length;
        }

        function openModal(photo) {
            modalImg.src = photo.url;
            modalCaption.textContent = `拍摄日期：${photo.date}`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { modalImg.src = ''; }, 300);
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            siteNav.classList.toggle('is-scrolled', scrollTop > 20);

            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            scrollProgress.style.width = scrollPercent + '%';
        });

        // 初始化
        renderPhotos();
        updateStats();
    </script>
</body>
</html>
