<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活光影</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: rgba(255, 255, 255, 0.68);
            --panel-strong: rgba(255, 255, 255, 0.86);
            --panel-stroke: rgba(255, 255, 255, 0.72);
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-tertiary: #6b7280;
            --blue: #0071e3;
            --blue-strong: #005fcc;
            --shadow-soft: 0 24px 80px rgba(15, 23, 42, 0.12);
            --shadow-card: 0 18px 60px rgba(15, 23, 42, 0.1);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 20px;
            --container: 1180px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at top left, rgba(116, 170, 255, 0.28), transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(255, 174, 204, 0.24), transparent 26%),
                radial-gradient(circle at 50% 100%, rgba(152, 203, 255, 0.18), transparent 24%),
                linear-gradient(180deg, #f8fbff 0%, #f3f6fb 46%, #eef2f8 100%);
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
        }

        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(24px);
            opacity: 0.55;
            animation: drift 16s var(--ease) infinite alternate;
        }

        .orb-one {
            top: 72px;
            left: -60px;
            width: 260px;
            height: 260px;
            background: linear-gradient(135deg, rgba(130, 189, 255, 0.6), rgba(255, 255, 255, 0.1));
        }

        .orb-two {
            top: 28%;
            right: -110px;
            width: 340px;
            height: 340px;
            background: linear-gradient(135deg, rgba(255, 196, 214, 0.48), rgba(197, 232, 255, 0.18));
            animation-duration: 20s;
        }

        .orb-three {
            bottom: -120px;
            left: 38%;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, rgba(172, 204, 255, 0.36), rgba(255, 255, 255, 0.08));
            animation-duration: 18s;
        }

        .progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            z-index: 30;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #7ab7ff 0%, #0071e3 42%, #8cc8ff 100%);
            box-shadow: 0 0 28px rgba(0, 113, 227, 0.45);
            transition: width 120ms linear;
        }

        .page-shell {
            position: relative;
            z-index: 1;
        }

        .container {
            width: min(calc(100% - 40px), var(--container));
            margin: 0 auto;
        }

        .glass {
            background: var(--panel);
            border: 1px solid var(--panel-stroke);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), var(--shadow-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
        }

        .site-nav-wrap {
            position: sticky;
            top: 18px;
            z-index: 20;
            padding-top: 22px;
        }

        .site-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 16px 14px 20px;
            border-radius: 999px;
            transition: transform 280ms var(--ease), background 280ms var(--ease), box-shadow 280ms var(--ease);
        }

        .site-nav.is-scrolled {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.78);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78), 0 24px 60px rgba(15, 23, 42, 0.14);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.94), rgba(132, 188, 255, 0.88));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 10px 24px rgba(0, 113, 227, 0.26);
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-link,
        .nav-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
            transition: transform 220ms var(--ease), background 220ms var(--ease), box-shadow 220ms var(--ease), color 220ms var(--ease);
        }

        .nav-link {
            color: var(--text-secondary);
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background: rgba(255, 255, 255, 0.62);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .nav-cta {
            color: white;
            background: linear-gradient(180deg, #1990ff 0%, #0071e3 100%);
            box-shadow: 0 14px 30px rgba(0, 113, 227, 0.28);
        }

        .nav-cta:hover,
        .nav-cta:focus-visible,
        .button-primary:hover,
        .button-primary:focus-visible {
            transform: translateY(-2px) scale(1.01);
            background: linear-gradient(180deg, #1f97ff 0%, #005fcc 100%);
        }

        .hero {
            padding: 56px 0 34px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.08fr 0.92fr;
            gap: 24px;
            align-items: stretch;
        }

        .hero-copy,
        .hero-feature {
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
        }

        .hero-copy {
            padding: 42px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin-bottom: 18px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.62);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .eyebrow::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(180deg, #5eb0ff, #0071e3);
            box-shadow: 0 0 12px rgba(0, 113, 227, 0.32);
        }

        h1, h2, h3, h4 {
            margin: 0;
            letter-spacing: -0.035em;
        }

        .hero-title {
            max-width: 12ch;
            font-size: clamp(3.4rem, 8vw, 5.8rem);
            line-height: 0.92;
        }

        .hero-description {
            max-width: 640px;
            margin: 22px 0 0;
            font-size: 1.04rem;
            line-height: 1.72;
            color: var(--text-secondary);
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 34px;
            flex-wrap: wrap;
        }

        .button-primary,
        .button-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 0 22px;
            border-radius: 999px;
            border: 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            transition: transform 220ms var(--ease), box-shadow 220ms var(--ease), background 220ms var(--ease);
        }

        .button-primary {
            color: white;
            background: linear-gradient(180deg, #1990ff 0%, #0071e3 100%);
            box-shadow: 0 16px 34px rgba(0, 113, 227, 0.28);
        }

        .button-secondary {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 14px 28px rgba(15, 23, 42, 0.08);
        }

        .button-secondary:hover,
        .button-secondary:focus-visible {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.84);
        }

        .hero-meta {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-top: 36px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.74);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), 0 18px 36px rgba(15, 23, 42, 0.08);
        }

        .stat-value {
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .stat-label {
            margin-top: 6px;
            color: var(--text-tertiary);
            font-size: 13px;
            line-height: 1.5;
        }

        .hero-feature {
            min-height: 400px;
        }

        .hero-feature-image {
            position: absolute;
            inset: 0;
            height: 100%;
            object-fit: cover;
            transform: scale(1.02);
        }

        .hero-feature::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(8, 12, 20, 0.02) 0%, rgba(8, 12, 20, 0.28) 48%, rgba(8, 12, 20, 0.74) 100%);
        }

        .hero-feature-content {
            position: absolute;
            inset: auto 24px 24px 24px;
            z-index: 1;
            padding: 24px;
            border-radius: 26px;
            background: rgba(16, 20, 34, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.24);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            color: white;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
        }

        .feature-tag,
        .article-tag,
        .mini-tag,
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            min-height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .feature-tag {
            color: rgba(255, 255, 255, 0.88);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .feature-title {
            margin-top: 18px;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            line-height: 1.02;
            max-width: 12ch;
        }

        .feature-description {
            margin-top: 12px;
            max-width: 44ch;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.6;
            font-size: 0.98rem;
        }

        .feature-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 13px;
        }

        .feature-link {
            color: white;
            font-weight: 600;
        }

        .section {
            padding: 24px 0;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 22px;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.04;
        }

        .section-copy {
            max-width: 48ch;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .pill-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pill {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), 0 12px 24px rgba(15, 23, 42, 0.05);
        }

        /* ========== 图片网格 ========== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .photo-card {
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 18px 48px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-6px) scale(1.015);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 28px 80px rgba(15, 23, 42, 0.14);
        }

        .photo-media {
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .photo-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 400ms var(--ease);
        }

        .photo-card:hover .photo-media img {
            transform: scale(1.06);
        }

        .photo-info {
            padding: 18px 20px 20px;
        }

        .photo-desc {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .photo-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .photo-date {
            font-family: inherit;
        }

        .photo-likes {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: color 200ms;
        }

        .photo-likes:hover {
            color: #e15759;
        }

        .photo-likes .heart {
            font-size: 16px;
            transition: transform 200ms var(--ease);
        }

        .photo-likes.liked .heart {
            color: #e15759;
            transform: scale(1.2);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-tertiary);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 300ms var(--ease), visibility 300ms;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 32px 100px rgba(0, 0, 0, 0.35);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: -48px;
            right: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 200ms;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .modal-caption {
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            text-align: center;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
            .hero-copy {
                min-height: 320px;
            }
            .hero-feature {
                min-height: 320px;
            }
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 18px;
            }
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.8rem;
            }
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 隐藏文件输入 */
        #fileInput {
            display: none;
        }

        /* 滚动进度 */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #7ab7ff, #0071e3, #8cc8ff);
            z-index: 100;
            transition: width 100ms linear;
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="ambient">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
    </div>

    <!-- 滚动进度条 -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="page-shell">
        <!-- 导航栏 -->
        <div class="container">
            <div class="site-nav-wrap">
                <nav class="site-nav glass" id="siteNav">
                    <div class="brand">
                        <div class="brand-mark">光</div>
                        <div class="brand-text">
                            <span class="brand-title">生活光影</span>
                            <span class="brand-subtitle">记录美好瞬间</span>
                        </div>
                    </div>
                    <div class="nav-links">
                        <button class="nav-cta" id="uploadBtn">上传照片</button>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Hero 区域 -->
        <div class="container">
            <section class="hero">
                <div class="hero-grid">
                    <div class="hero-copy glass">
                        <div>
                            <div class="eyebrow">生活分享博客</div>
                            <h1 class="hero-title">用光影<br>书写生活</h1>
                            <p class="hero-description">
                                每一张照片都是生活的注脚。在这里，用镜头捕捉日常中的温暖与美好，分享属于你的光影故事。
                            </p>
                        </div>
                        <div>
                            <div class="hero-actions">
                                <button class="button-primary" id="heroUploadBtn">开始上传</button>
                                <button class="button-secondary" onclick="document.getElementById('gallery').scrollIntoView({behavior:'smooth'})">浏览相册</button>
                            </div>
                            <div class="hero-meta">
                                <div class="stat-card">
                                    <div class="stat-value" id="totalPhotos">0</div>
                                    <div class="stat-label">张照片</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="totalLikes">0</div>
                                    <div class="stat-label">次点赞</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="totalDays">1</div>
                                    <div class="stat-label">天记录</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="hero-feature glass">
                        <div class="hero-feature-content">
                            <span class="feature-tag"> 精选推荐</span>
                            <h3 class="feature-title">发现生活中的小确幸</h3>
                            <p class="feature-description">上传你的第一张照片，开启这段光影之旅。每一刻都值得被记录。</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- 图片画廊 -->
        <div class="container">
            <section class="section" id="gallery">
                <div class="section-heading">
                    <div>
                        <h2 class="section-title">我的相册</h2>
                        <p class="section-copy">点击下方"上传照片"按钮，选择 JPG 或 PNG 格式的图片添加到你的光影日记。</p>
                    </div>
                    <div class="pill-row">
                        <span class="pill">全部</span>
                        <span class="pill">最新</span>
                        <span class="pill">最热</span>
                    </div>
                </div>

                <!-- 图片网格（初始为空，无内置图片） -->
                <div class="photo-grid" id="photoGrid">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon"></div>
                        <p>相册还是空的，上传第一张照片吧！</p>
                        <button class="button-primary" id="emptyUploadBtn">上传照片</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 模态框（查看大图） -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose"></button>
            <img src="" alt="大图预览" id="modalImg">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" accept="image/jpeg, image/png">

    <script>
        // 图片数据数组（初始为空，无内置数据）
        let photos = [];

        // DOM 元素
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const heroUploadBtn = document.getElementById('heroUploadBtn');
        const emptyUploadBtn = document.getElementById('emptyUploadBtn');
        const photoGrid = document.getElementById('photoGrid');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const modalClose = document.getElementById('modalClose');
        const scrollProgress = document.getElementById('scrollProgress');
        const siteNav = document.getElementById('siteNav');
        const totalPhotos = document.getElementById('totalPhotos');
        const totalLikes = document.getElementById('totalLikes');
        const totalDays = document.getElementById('totalDays');

        // 绑定上传按钮事件
        [uploadBtn, heroUploadBtn, emptyUploadBtn].forEach(btn => {
            btn.addEventListener('click', () => fileInput.click());
        });

        // 文件选择处理
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 验证文件格式
            const validTypes = ['image/jpeg', 'image/png'];
            if (!validTypes.includes(file.type)) {
                alert('请选择 JPG 或 PNG 格式的图片');
                return;
            }

            // 验证文件大小（最大 10MB）
            if (file.size > 10 * 1024 * 1024) {
                alert('图片大小不能超过 10MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const imageUrl = event.target.result;
                const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD

                // 添加到数组最前方
                photos.unshift({
                    id: Date.now(),
                    url: imageUrl,
                    desc: '新拍的一刻',
                    date: today,
                    likes: 0,
                    liked: false
                });

                renderPhotos();
                updateStats();
            };
            reader.readAsDataURL(file);

            // 重置 input，允许重复上传同一文件
            fileInput.value = '';
        });

        // 渲染图片网格
        function renderPhotos() {
            // 清除现有内容（保留 emptyState）
            photoGrid.innerHTML = '';

            if (photos.length === 0) {
                photoGrid.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <div class="photo-media">
                        <img src="${photo.url}" alt="${photo.desc}" loading="lazy">
                    </div>
                    <div class="photo-info">
                        <div class="photo-desc">${photo.desc}</div>
                        <div class="photo-meta">
                            <span class="photo-date">${photo.date}</span>
                            <span class="photo-likes ${photo.liked ? 'liked' : ''}" data-id="${photo.id}">
                                <span class="heart">${photo.liked ? '♥' : '♡'}</span>
                                <span>${photo.likes}</span>
                            </span>
                        </div>
                    </div>
                `;

                // 点击打开模态框
                card.addEventListener('click', (e) => {
                    // 如果点击的是点赞区域，不打开模态框
                    if (e.target.closest('.photo-likes')) return;
                    openModal(photo);
                });

                // 点赞功能
                const likeBtn = card.querySelector('.photo-likes');
                likeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleLike(photo.id);
                });

                photoGrid.appendChild(card);
            });
        }

        // 点赞切换
        function toggleLike(id) {
            const photo = photos.find(p => p.id === id);
            if (!photo) return;

            photo.liked = !photo.liked;
            photo.likes += photo.liked ? 1 : -1;

            renderPhotos();
            updateStats();
        }

        // 更新统计
        function updateStats() {
            totalPhotos.textContent = photos.length;
            totalLikes.textContent = photos.reduce((sum, p) => sum + p.likes, 0);
            // 计算记录天数
            const uniqueDays = new Set(photos.map(p => p.date));
            totalDays.textContent = uniqueDays.size;
        }

        // 打开模态框
        function openModal(photo) {
            modalImg.src = photo.url;
            modalCaption.textContent = `${photo.desc}  ·  ${photo.date}`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭模态框
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                modalImg.src = '';
            }, 300);
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // 导航栏滚动效果
        window.addEventListener('scroll', () => {
            // 导航栏背景
            if (window.scrollY > 20) {
                siteNav.classList.add('is-scrolled');
            } else {
                siteNav.classList.remove('is-scrolled');
            }

            // 滚动进度条
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            scrollProgress.style.width = scrollPercent + '%';
        });

        // 初始化统计
        updateStats();
    </script>
</body>
</html>
